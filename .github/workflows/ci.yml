name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Fetch git dependencies with the git CLI so it uses the ssh-agent below.
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # spec-trace is a private git dependency fetched over SSH; the secret
      # holds the private half of a read-only deploy key on ywata/spec-trace.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SPEC_TRACE_SSH_KEY }}
      - uses: dtolnay/rust-toolchain@stable
      # spec-trace owns the rule that tests record coverage through its covers!
      # (spec-trace-spec/impl/covers-must-record). Its check-macros command finds
      # local covers! definitions. Install the CLI at the revision this run
      # resolves for the library, so the check and the macro match.
      - name: Install spec-trace CLI
        run: |
          cargo generate-lockfile
          rev=$(sed -n 's|^source = "git+ssh://git@github.com/ywata/spec-trace#\([0-9a-f]*\)"$|\1|p' Cargo.lock | head -n 1)
          test -n "$rev"
          cargo install --locked --git ssh://git@github.com/ywata/spec-trace --rev "$rev" spec-trace
      - name: Check for local covers! macros
        run: spec-trace check-macros --docs CLAUDE.md
      # The build script must write only under OUT_DIR, since consumers build
      # from cargo's read-only git checkout (specs/packaging/build-script.md).
      # A read-only source tree turns any such write into a CI failure.
      - name: Make source tree read-only
        run: chmod -R a-w src specs tests spec-files.txt build.rs Cargo.toml
      - name: Run tests
        run: cargo test --all-features
      - name: Run clippy
        run: cargo clippy -- -D warnings
      - name: Check formatting
        run: cargo fmt --check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # spec-trace is a private git dependency fetched over SSH; the secret
      # holds the private half of a read-only deploy key on ywata/spec-trace.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SPEC_TRACE_SSH_KEY }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
